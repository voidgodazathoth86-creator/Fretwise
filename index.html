<title>Fretwise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: side rail on wide screens, bottom tab bar on phones. Home screen is a week laid out as a fretboard. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#E3E8ED; --ink:#121C26; --muted:#4F5D6A; --line:#C9D1D9;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --warm:#B94D14; --good:#1E7A4B; --warn:#8F5A00;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1419; --surface:#161E26; --surface2:#1F2A34; --ink:#E7EDF2; --muted:#9AA9B6; --line:#2B3844;
    --accent:#4FC3CF; --accent-ink:#06222A; --warm:#F08A4B; --good:#5CCB8E; --warn:#E5B04A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1419; --surface:#161E26; --surface2:#1F2A34; --ink:#E7EDF2; --muted:#9AA9B6; --line:#2B3844;
  --accent:#4FC3CF; --accent-ink:#06222A; --warm:#F08A4B; --good:#5CCB8E; --warn:#E5B04A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;display:grid;gap:20px;padding-block:20px 96px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;min-width:0;background:none;border:0;padding:8px 2px;border-radius:10px;color:var(--muted);font-weight:600;font-size:.74rem;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--surface2)}
main{min-width:0;display:grid;gap:20px;align-content:start}
@media (min-width:820px){
  .app{grid-template-columns:190px minmax(0,1fr);gap:32px;padding-block:32px 48px}
  .tabs{position:sticky;top:32px;align-self:start;flex-direction:column;border:0;background:none;padding:0;gap:4px}
  .tabs button{flex-direction:row;gap:12px;padding:11px 14px;font-size:.95rem;justify-content:flex-start}
  .brand{display:block!important}
}
.brand{display:none;font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin-bottom:14px;padding-inline:14px}
.brand i{font-style:normal;color:var(--accent)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.stack{display:grid;gap:10px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:42px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;min-height:34px;font-size:.88rem}
.btn.danger{background:transparent;color:var(--warm);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.76rem;font-weight:600;background:var(--surface2);color:var(--muted)}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.warm{color:var(--warm)}
input[type=text],input[type=number],input[type=time],input[type=date],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;max-width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
label.f{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good>i{background:var(--good)}
.big{font-family:var(--f-mono);font-weight:600;font-size:2.6rem;line-height:1}
.notice{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:.9rem;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice.due{background:var(--accent);color:var(--accent-ink)}
/* week as fretboard */
.fb{position:relative;display:grid;grid-template-columns:repeat(7,1fr);height:150px;background:var(--surface2);border-radius:12px;overflow:hidden}
.fb .str{position:absolute;left:0;right:0;height:1px;background:var(--muted);opacity:.55}
.fb .cell{position:relative;border-left:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;gap:6px;min-width:0}
.fb .cell:first-of-type{border-left:0}
.fb .dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-62%);border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.7rem;font-weight:700;font-family:var(--f-mono)}
.fb .dot.empty{background:transparent;border:2px dashed var(--muted);opacity:.6}
.fb .dot.today{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--warm)}
.fb .dl{font-size:.72rem;font-weight:600;color:var(--muted);position:relative}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.7rem;line-height:1}
/* lessons */
.unit{display:grid;gap:10px}
.lesson{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--ink)}
.lesson .n{flex:none;width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600}
.lesson.done .n{background:var(--good);color:var(--bg)}
.lesson.chal{border-style:dashed;border-color:var(--warm)}
.lesson.chal .n{background:var(--warm);color:var(--bg)}
.lesson.locked{opacity:.6;cursor:not-allowed}
.lesson>div{min-width:0}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.right{border-color:var(--good);background:var(--surface2)}
.opt.wrong{border-color:var(--warm)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.diagrams{display:flex;gap:14px;flex-wrap:wrap}
.dg{display:grid;justify-items:center;gap:2px;font-weight:600;font-size:.85rem}
.dg svg{width:96px;height:auto;overflow:visible}
.dg .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
.dg .nut{stroke:var(--ink);stroke-width:4}
.dg .nt{fill:var(--ink)}
.dg .rt{fill:var(--accent)}
.dg .op{stroke:var(--ink);stroke-width:1.4;fill:none}
.meter{height:10px;border-radius:9px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .08s}
.btn.recstop{background:var(--warm);color:#fff}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;resize:vertical}
.dg{max-width:118px;text-align:center}
.dg small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;line-height:1.25}
.dg text{fill:var(--muted);font-size:9px;font-family:var(--f-mono)}
/* goals + charts */
.hist{display:flex;gap:8px;align-items:flex-end;height:150px;padding-top:18px}
.hist .col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.hist .b{width:100%;max-width:44px;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px}
.hist .b.full{background:var(--good)}
.hist .v{font-family:var(--f-mono);font-size:.7rem}
.hist .l{font-size:.68rem;color:var(--muted);white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
.timer{display:grid;gap:14px;justify-items:center;text-align:center;padding-block:6px}
.beats{display:flex;gap:10px;justify-content:center}
.beat{width:22px;height:22px;border-radius:50%;background:var(--surface2)}
.beat.on{background:var(--accent)}
.beat.on.first{background:var(--warm)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (min-width:820px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* onboarding, guitar diagrams, puzzle */
.app.solo{grid-template-columns:minmax(0,1fr);max-width:720px}
body.kid{font-size:17px}
body.kid .chip,body.kid .btn{min-height:50px}
.choice{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.pick{display:grid;gap:8px;justify-items:start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;color:var(--ink)}
.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pick b{font-family:var(--f-display);font-size:1.15rem}
.pick svg{width:70px;height:auto}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--surface2)}
.steps i.on{background:var(--accent)}
.gt{width:100%;max-width:360px;height:auto;display:block;margin-inline:auto}
.gt-body{fill:var(--surface2);stroke:var(--ink);stroke-width:1.6}
.gt-neck{fill:var(--bg);stroke:var(--ink);stroke-width:1.3}
.gt-dark{fill:var(--ink)}
.gt-metal{fill:var(--muted);stroke:var(--ink);stroke-width:.8}
.gt-ring{fill:none;stroke:var(--muted);stroke-width:2}
.gt-fret{stroke:var(--muted);stroke-width:.9}
.gt-str{stroke:var(--ink);stroke-width:.8;opacity:.75}
.gt-dot{fill:var(--muted)}
.gt-peg{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.gt-pin{fill:var(--surface)}
.gt-saddle{stroke:var(--surface);stroke-width:2}
.gt-guard{fill:var(--muted);opacity:.55}
.gt-lead{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.gt-lead.hl{stroke:var(--warm);stroke-width:2;stroke-dasharray:none}
.gt-tgt{fill:var(--accent)}
.gt-tgt.hl{fill:var(--warm)}
.slot{cursor:pointer}
.slot circle{fill:var(--surface);stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}
.slot text{fill:var(--ink);font:600 12px var(--f-mono)}
.slot.ok circle{fill:var(--accent);stroke-dasharray:none}
.slot.ok text{fill:var(--accent-ink)}
.slot.sel circle{stroke:var(--warm);stroke-width:3;stroke-dasharray:none}
.gt-lab{fill:var(--ink);font:600 10.5px var(--f-body)}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--surface);border:2px solid var(--accent);color:var(--ink);border-radius:12px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:44px}
.tile[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tile[disabled]{opacity:.4;border-style:dashed;cursor:default}
.leg{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.leg.hl{border-color:var(--warm);box-shadow:inset 0 0 0 1px var(--warm)}
.leg .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 .8rem var(--f-mono)}
.leg>span:last-child{min-width:0}
.vt{display:flex;gap:12px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.vt>span{min-width:0}
.pc{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
details>summary{cursor:pointer;font-weight:600}
.dgrid{display:grid;gap:16px;grid-template-columns:minmax(0,360px) minmax(0,1fr);align-items:start}
@media (max-width:700px){.dgrid{grid-template-columns:minmax(0,1fr)}}
[hidden]{display:none!important}
</style>

<div class="app">
  <nav class="tabs" id="tabs" aria-label="Sections">
    <div class="brand">Fret<i>wise</i></div>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const EDITION='full';
const FREE=EDITION==='free';
/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pdate=s=>new Date(s+'T00:00:00');
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const weekStart=d=>addDays(d,-((d.getDay()+6)%7));
const monthStart=d=>new Date(d.getFullYear(),d.getMonth(),1);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=m=>m>=60?(Math.floor(m/60)+' hr'+(m%60?' '+(m%60)+' min':'')):m+' min';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const fmtDay=s=>pdate(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtTime=t=>{const [h,m]=t.split(':').map(Number);return ((h+11)%12+1)+':'+pad(m)+' '+(h<12?'AM':'PM')};

/* ---------- chord + diagram data ---------- */
const parseF=f=>Array.isArray(f)?f.slice():(f.indexOf(' ')>=0?f.split(' '):f.split('')).map(v=>v==='x'?'x':+v);
const CH={
 'Em':{f:'022000',l:1},'Am':{f:'x02210',l:1},'C':{f:'x32010',l:1},'G':{f:'320003',l:1},'D':{f:'xx0232',l:1},
 'E':{f:'022100',l:2},'A':{f:'x02220',l:2},'Dm':{f:'xx0231',l:2},'F (easy)':{f:'xx3211',l:2},
 'E7':{f:'020100',l:2},'A7':{f:'x02020',l:2},'D7':{f:'xx0212',l:2},'Asus2':{f:'x02200',l:2},'Em7':{f:'022030',l:2},
 'F':{f:[1,3,3,2,1,1],b:{f:1,from:0,to:5},l:3},'Bm':{f:'x24432',b:{f:2,from:1,to:5},l:3},
 'G7':{f:'320001',l:3},'B7':{f:'x21202',l:3},'Am7':{f:'x02010',l:3},
 'Cmaj7':{f:'x32000',l:4},'Dm7':{f:'xx0211',l:4},'Fmaj7':{f:'xx3210',l:4},'Cadd9':{f:'x32030',l:4},
 'C (A shape)':{f:'x 3 5 5 5 3',b:{f:3,from:1,to:5},l:4},'C (E shape)':{f:'8 10 10 9 8 8',b:{f:8,from:0,to:5},l:4}
};
const BOX_AM={notes:[[0,5,1],[0,8],[1,5],[1,7],[2,5],[2,7,1],[3,5],[3,7],[4,5],[4,8],[5,5,1],[5,8]],base:5,mutes:[],opens:[]};
function diagram(spec,label,sub){
  const x0=24,dx=12.8,y0=30,dy=17,rows=5;
  let notes,mutes=[],opens=[],base=1,barre=null;
  if(spec.notes){notes=spec.notes.map(n=>({s:n[0],f:n[1],r:!!n[2]}));base=spec.base||1;}
  else{
    const fr=parseF(spec.f);notes=[];
    fr.forEach((v,s)=>{if(v==='x')mutes.push(s);else if(v===0)opens.push(s);else notes.push({s,f:v,r:!!(spec.rs&&spec.rs.includes(s))});});
    const pos=notes.map(n=>n.f);const mx=Math.max(0,...pos),mn=pos.length?Math.min(...pos):1;
    base=mx<=5?1:mn;barre=spec.b||null;
  }
  const X=s=>x0+s*dx, Y=f=>y0+(f-base)*dy+dy/2;
  let g='';
  for(let i=0;i<=rows;i++)g+=`<line class="${i===0&&base===1?'nut':'ln'}" x1="${x0}" x2="${x0+5*dx}" y1="${y0+i*dy}" y2="${y0+i*dy}"/>`;
  for(let s=0;s<6;s++)g+=`<line class="ln" x1="${X(s)}" x2="${X(s)}" y1="${y0}" y2="${y0+rows*dy}"/>`;
  mutes.forEach(s=>g+=`<path class="op" d="M${X(s)-3.5} 16.5l7 7m0-7l-7 7"/>`);
  opens.forEach(s=>g+=`<circle class="op" cx="${X(s)}" cy="20" r="3.6"/>`);
  if(barre)g+=`<rect class="nt" x="${X(barre.from)-6}" y="${Y(barre.f)-6}" width="${X(barre.to)-X(barre.from)+12}" height="12" rx="6"/>`;
  notes.forEach(n=>g+=`<circle class="${n.r?'rt':'nt'}" cx="${X(n.s)}" cy="${Y(n.f)}" r="5.4"/>`);
  if(base>1)g+=`<text x="0" y="${y0+dy*.65}">${base}fr</text>`;
  return `<figure class="dg" style="margin:0"><svg viewBox="0 0 104 124" role="img" aria-label="${esc(label||'Chord diagram')}">${g}</svg><figcaption>${esc(label||'')}${sub?`<small>${esc(sub)}</small>`:''}</figcaption></figure>`;
}
const chordFig=name=>diagram(CH[name],name);
/* CHORD-ENGINE-START */
const CE=(()=>{
const OPEN_PC=[4,9,2,7,11,4];
const RN=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
/* quality: s=suffix, iv=allowed intervals, rq=required intervals */
const Q={
 maj:{s:'',iv:[0,4,7],rq:[0,4,7]},min:{s:'m',iv:[0,3,7],rq:[0,3,7]},p5:{s:'5',iv:[0,7],rq:[0,7]},
 d7:{s:'7',iv:[0,4,7,10],rq:[0,4,10]},m7:{s:'m7',iv:[0,3,7,10],rq:[0,3,10]},maj7:{s:'maj7',iv:[0,4,7,11],rq:[0,4,11]},
 sus2:{s:'sus2',iv:[0,2,7],rq:[0,2,7]},sus4:{s:'sus4',iv:[0,5,7],rq:[0,5,7]},s7sus4:{s:'7sus4',iv:[0,5,7,10],rq:[0,5,10]},
 add9:{s:'add9',iv:[0,2,4,7],rq:[0,2,4]},madd9:{s:'m(add9)',iv:[0,2,3,7],rq:[0,2,3]},
 six:{s:'6',iv:[0,4,7,9],rq:[0,4,9]},m6:{s:'m6',iv:[0,3,7,9],rq:[0,3,9]},six9:{s:'6/9',iv:[0,2,4,7,9],rq:[0,2,4,9]},
 dim:{s:'dim',iv:[0,3,6],rq:[0,3,6]},aug:{s:'aug',iv:[0,4,8],rq:[0,4,8]},dim7:{s:'dim7',iv:[0,3,6,9],rq:[0,3,6,9]},

{id:'l6',unit:'Beginner',title:'Dm, F and chords in a key',min:30,blurb:'Chords that belong together, and your first easy F.',chords:['Dm','F (easy)','C','G'],
 steps:['Dm: index on the 1st fret of e, middle on the 2nd fret of G, ring on the 3rd fret of B. Strum the four thinnest strings.','Easy F plays the four thinnest strings: index barres the 1st fret of the B and e strings.','In the key of C, the chords are C, Dm, Em, F, G, Am. The I, IV and V chords are C, F and G.'],
 drills:['Fret Dm and easy F cleanly','Play C, F, G with four strums each','Play Am, Dm, G, C at 70 BPM'],
 qs:[{q:'Dm (xx0231) is a…',o:['Minor chord','Major chord','Dominant 7th'],a:0,w:'The m means minor.'},
     {q:'In the key of C major, the I, IV and V chords are…',o:['C, F, G','C, D, E','C, G, A'],a:0,w:'I = C, IV = F, V = G.'}]},
{id:'l7',unit:'Intermediate',title:'The minor pentatonic scale',min:30,blurb:'Your first scale and the key to riffs and solos.',boxes:[['A minor pentatonic, box 1',BOX_AM]],tips:{acoustic:'Pentatonic works on any guitar. Try playing it softly, then with more force, to hear the difference.',electric:'This scale is the heart of rock and blues solos. Try it through an amp with a little gain.',classical:'Scales are the base of classical technique too. Alternate your i and m fingers as you pluck.'},
 steps:['A pentatonic scale has five notes per octave. It is the sound behind most rock and blues riffs.','Box 1 of A minor pentatonic starts on the 5th fret. Use one finger per fret: index on fret 5, ring on fret 7 or 8 as shown. Accent-colored dots are the root note, A.','Play it slowly up and down, one note per click.'],
 drills:['Play box 1 up and down, one note per click at 60 BPM','Repeat in eighth notes at 60 BPM','Improvise over a strummed Am chord using only these notes'],
 qs:[{q:'How many notes does a pentatonic scale have per octave?',o:['5','7','12'],a:0,w:'Penta means five.'},
     {q:'Box 1 of A minor pentatonic starts at which fret?',o:['5th','1st','12th'],a:0,w:'The root A on the low E string is at the 5th fret.'}]},
{id:'l8',unit:'Intermediate',title:'Barre chords',min:35,blurb:'Movable shapes that work anywhere on the neck.',chords:['F','Bm'],tips:{acoustic:'Barre chords need strong fingers. Build up with short tries on steel strings.',electric:'Barre chords are easier on the lighter strings of an electric.',classical:'The wider neck makes a barre feel longer. Keep your thumb low behind the neck.'},
 steps:['F major is the E-shape chord moved to the 1st fret, with your index finger as the nut.','Press with the side of the index finger just behind the fret, not on top of the wire.','Slide the same E shape up two frets to get G at the 3rd fret. Bm uses the A shape with a barre at the 2nd fret.'],
 drills:['Barre the 1st fret with all six strings and check every one rings','Form F, then slide up to G (3rd fret) and back','Play Bm, then Em, switching every four beats'],
 qs:[{q:'The E-shape barre chord at the 1st fret is…',o:['F major','E major','G major'],a:0,w:'E shape moved up one fret is F.'},
     {q:'For a clean barre, the index finger should…',o:['Press just behind the fret with the side of the finger','Sit in the middle between two frets','Lie flat with no pressure'],a:0,w:'Pressure just behind the fret wire gives a clean note.'}]},
{id:'l9',unit:'Intermediate',title:'Hammer-ons, pull-offs and slides',min:30,blurb:'Make single notes sound smooth and expressive.',boxes:[['A minor pentatonic, box 1',BOX_AM]],
 steps:['Hammer-on: pick a fretted note, then press a higher fret down hard with another finger without picking again.','Pull-off: with two fingers down, pluck the string by pulling the upper finger off sideways so the lower note sounds.','Slide: pick a note and keep pressure while moving along the string to another fret.'],
 drills:['Hammer-on from fret 5 to 7 on the A string, ten times','Pull-off from fret 7 to 5 on the A string, ten times','Slide from fret 5 to 7 and back on each string of box 1'],
 qs:[{q:'A hammer-on is played by…',o:['Fretting a higher note with another finger without picking again','Picking the string twice','Sliding the finger off the string'],a:0,w:'The second note comes from the finger landing, not a new pick.'},
     {q:'A pull-off moves the pitch…',o:['Lower','Higher','Not at all'],a:0,w:'You pull off to a lower note.'}]},
{id:'l10',unit:'Advanced',title:'The CAGED system',min:40,blurb:'See every chord in five positions across the neck.',chords:['C','C (A shape)','C (E shape)'],
 steps:['CAGED names the five open chord shapes C, A, G, E and D. Each can be moved up the neck with a barre to play the same chord in a new position.','C major climbs the neck like this: open C shape, A shape at the 3rd fret, G shape at the 5th, E shape at the 8th, D shape at the 10th.','Learning the five positions lets you play any chord anywhere and link scales to chords.'],
 drills:['Play C in the open C shape, then the A shape at the 3rd fret','Add the E shape at the 8th fret and compare the sound','Play the order C, A, G, E, D shapes for C major without looking up'],
 qs:[{q:'CAGED stands for…',o:['Five open chord shapes that can be moved up the neck','Chord, Arpeggio, Group, Extension, Drill','Five alternate tunings'],a:0,w:'C, A, G, E, D are the five shapes.'},
     {q:'In how many CAGED positions can one chord be played?',o:['5','3','7'],a:0,w:'One position per shape.'}]},
{id:'l11',unit:'Advanced',title:'Modes: Dorian',min:40,blurb:'A minor scale with a brighter sixth.',
 steps:['Dorian is a natural minor scale with a raised 6th. That gives it a jazzy, hopeful sound.','A Dorian uses the notes A B C D E F# G, the same notes as G major, starting on A.','Play over an Am to D vamp. The D chord supports the raised 6th (F#).'],
 drills:['Play A Dorian from the 5th fret, starting and ending on A','Compare it with A minor pentatonic, then add the F# and B','Improvise over Am and D, two bars each'],
 qs:[{q:'Dorian is like natural minor with a…',o:['Raised 6th','Lowered 2nd','Raised 7th'],a:0,w:'The raised 6th is the signature of Dorian.'},
     {q:'A Dorian contains the same notes as…',o:['G major','A major','E major'],a:0,w:'A is the second note of G major.'}]},
{id:'l12',unit:'Advanced',title:'Seventh chords and ii–V–I',min:40,blurb:'The most common move in jazz and a lot of pop.',chords:['Dm7','G7','Cmaj7','Cadd9'],
 steps:['Seventh chords add a fourth note. Cmaj7 adds B to C, Dm7 adds C to Dm, and G7 adds F to G.','In C major the ii–V–I is Dm7, G7, Cmaj7.','Move as few fingers as possible between chords. This is called voice leading.'],
 drills:['Play Dm7, G7, Cmaj7 slowly, one bar each','Find the smallest finger move between each pair','Play ii–V–I at 70 BPM with D, D U, U D U'],
 qs:[{q:'In C major, the ii–V–I progression is…',o:['Dm7, G7, Cmaj7','Cmaj7, Dm7, G7','G7, Dm7, Cmaj7'],a:0,w:'ii = Dm7, V = G7, I = Cmaj7.'},
     {q:'Cmaj7 adds which note to a C major chord?',o:['B, the major 7th','Bb','D'],a:0,w:'The major 7th above C is B.'}]},
{id:'l13',unit:'Advanced',title:'Fingerstyle and Travis picking',min:40,blurb:'Play bass and melody together with your thumb and fingers.',
 steps:['In fingerstyle you pluck the strings with your thumb and fingers instead of a pick. The letters p, i, m and a name the thumb, index, middle and ring fingers.','Travis picking: the thumb alternates between two bass strings in a steady rhythm while the index, middle and ring fingers pluck the 3rd, 2nd and 1st strings.','Start slowly on a C chord: thumb on the 5th string, then the 4th, with fingers picking the higher strings in between.'],
 drills:['Pluck the 3rd, 2nd and 1st strings with i, m and a on an open chord','Alternate your thumb between the 5th and 4th strings in steady beats at 60 BPM','Combine both on C at 60 BPM for eight bars'],
 qs:[{q:'In Travis picking, the thumb…',o:['Alternates between bass strings in a steady rhythm','Plays only the thinnest strings','Never moves'],a:0,w:'The steady thumb is the heartbeat of the pattern.'},
     {q:'Which fingers do the letters i, m and a name?',o:['Index, middle and ring','Index, middle and pinky','Thumb, index and middle'],a:0,w:'p is the thumb, i the index, m the middle, a the ring finger.'}],
 t:{electric:{title:'Power chords, palm muting and bends',blurb:'Heavy rhythm sounds and expressive single notes.',
   steps:['A power chord has just the root and the fifth. E5 is played 022xxx: the 6th string open and the 5th and 4th strings at the 2nd fret. The shape slides up the neck, with the root on the 6th string.','Palm muting: rest the edge of your picking hand on the strings just in front of the bridge. It gives a short, thumpy sound.','A bend pushes a string sideways across the fret to raise the pitch. Use your ring finger backed up by the fingers behind it.'],
   drills:['Play E5 with downstrokes at 80 BPM, then slide the shape to A5 (577xxx) and B5 (799xxx)','Add palm muting to your downstrokes','Bend the 3rd string at the 7th fret up one whole step, ten times'],
   qs:[{q:'A power chord contains…',o:['The root and the fifth','The root, third and fifth','The root and the seventh'],a:0,w:'Power chords leave out the third.'},
       {q:'Palm muting is done by resting…',o:['The edge of your picking hand on the strings near the bridge','A finger on the nut','A capo on the 1st fret'],a:0,w:'The edge of the picking hand lightly touches the strings by the bridge.'}]},
  classical:{title:'Arpeggios with p, i, m, a',blurb:'Play the notes of a chord one at a time, with a clear tone.',
   steps:['In classical technique the right-hand fingers are named p (thumb), i (index), m (middle) and a (ring).','An arpeggio plays the notes of a chord one at a time. A common pattern is p i m a: the thumb on a bass string, then i, m and a on the 3rd, 2nd and 1st strings.','Free stroke (tirando) plucks and lets the finger swing past without touching the next string. Rest stroke (apoyando) plucks and lands on the next string for a fuller, louder note.'],
   drills:['Place p on the 5th string, i on the 3rd, m on the 2nd and a on the 1st, then play p i m a slowly','Play a free stroke on each treble string, then a rest stroke on each','Play p i m a over C, Am, Dm and G, one bar each at 60 BPM'],
   qs:[{q:'In classical guitar technique, the letter p stands for…',o:['The thumb','The pinky','The pick'],a:0,w:'p is for pulgar, the thumb.'},
       {q:'A rest stroke is when the finger…',o:['Lands on the next string after plucking','Swings past without touching another string','Plays two strings at once'],a:0,w:'A rest stroke lands on the next string.'}]}}}
];

    goals:[{id:uid(),name:'Steady Builder',period:'week',start:dstr(addDays(ws,-35)),targets:[{dur:60,count:3},{dur:10,count:7}]}],

}

/* ---------- derived data ---------- */
const sessionsIn=(a,b)=>S.sessions.filter(s=>s.d>=a&&s.d<=b);
const totalMin=()=>S.sessions.reduce((t,s)=>t+s.min,0);
function points(){
  let p=S.sessions.filter(x=>!x.demo).reduce((t,x)=>t+x.min,0);p+=(Object.keys(S.lessons).length-Object.keys(S.skipped||{}).length)*50;p+=Object.values(S.chals).filter(c=>c.done).length*150;p+=Object.values(S.puzzle||{}).reduce((a,b)=>a+b*10,0);return p;
}
function levelName(p){let n=LEVELS[0];for(const L of LEVELS)if(p>=L[0])n=L;const i=LEVELS.indexOf(n),nx=LEVELS[i+1];return {name:n[1],next:nx?nx[0]:null,nextName:nx?nx[1]:null,from:n[0]};}
function streak(){
  const days=new Set(S.sessions.map(s=>s.d));let d=new Date();if(!days.has(dstr(d)))d=addDays(d,-1);let n=0;
  while(days.has(dstr(d))){n++;d=addDays(d,-1);}return n;
}
function pStart(period,d){return period==='week'?weekStart(d):monthStart(d)}
function pEnd(period,s){return period==='week'?addDays(s,6):new Date(s.getFullYear(),s.getMonth()+1,0)}
function pNext(period,s){return period==='week'?addDays(s,7):new Date(s.getFullYear(),s.getMonth()+1,1)}
function goalIn(goal,start){
  const end=pEnd(goal.period,start);
  const ss=sessionsIn(dstr(start),dstr(end)).slice().sort((a,b)=>b.min-a.min);
  const tg=goal.targets.slice().sort((a,b)=>b.dur-a.dur).map(t=>({dur:t.dur,count:t.count,done:0}));
  ss.forEach(s=>{const t=tg.find(t=>t.dur<=s.min&&t.done<t.count);if(t)t.done++;});
  const need=tg.reduce((a,t)=>a+t.count,0),got=tg.reduce((a,t)=>a+Math.min(t.done,t.count),0);
  return {start,end,targets:tg,pct:need?Math.round(100*got/need):0,minutes:ss.reduce((a,s)=>a+s.min,0),n:ss.length,
    targetMin:tg.reduce((a,t)=>a+t.dur*t.count,0)};
}
function goalHistory(goal){
  const out=[],cur=pStart(goal.period,new Date());let s=pStart(goal.period,pdate(goal.start));
  while(s<=cur){const r=goalIn(goal,s);r.current=dstr(s)===dstr(cur);out.push(r);s=pNext(goal.period,s);}
  return out;
}
function planProgress(p){
  const s=pStart(p.per,new Date()),e=pEnd(p.per,s);
  const n=sessionsIn(dstr(s),dstr(e)).filter(x=>x.min>=p.dur).length;return {done:n,end:e};
}
function planLabel(p){
  return (p.dur>=60?(fm(p.dur)+'+'):fm(p.dur))+' · '+p.times+'× per '+p.per;
}

/* ---------- audio (metronome, tones, timer chime) ---------- */
let AC=null;
function ctx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(freq,dur,type,vol,when){
  const c=ctx();if(!c)return;const t=when||c.currentTime;
  const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+0.05);
}
const Met={bpm:80,beats:4,run:false,cur:0,next:0,id:null,taps:[]};
function metStep(){
  const c=ctx();if(!c)return;
  while(Met.next<c.currentTime+0.12){
    const first=Met.cur===0,b=Met.cur,t=Met.next;
    tone(first?1500:1000,0.05,'square',first?0.25:0.16,t);
    setTimeout(()=>{document.querySelectorAll('.beat').forEach((el,i)=>el.classList.toggle('on',i===b));
      const f=document.querySelector('.beat');if(f)f.classList.add('first');},Math.max(0,(t-c.currentTime)*1000));
    Met.next+=60/Met.bpm;Met.cur=(Met.cur+1)%Met.beats;
  }
}
function metToggle(){
  if(Met.run){clearInterval(Met.id);Met.run=false;document.querySelectorAll('.beat').forEach(e=>e.classList.remove('on'));}
  else{const c=ctx();if(!c){toast('Sound is not available in this browser.');return;}Met.cur=0;Met.next=c.currentTime+0.05;Met.run=true;Met.id=setInterval(metStep,25);metStep();}
  const b=$('#metGo');if(b)b.textContent=Met.run?'Stop':'Start';
}

/* ---------- practice timer ---------- */
const T={dur:20,left:20*60,run:false,end:0,id:null,elapsed:0};
let wake=null;
function timerDigits(){const m=Math.floor(T.left/60),s=T.left%60;return pad(m)+':'+pad(s);}
function timerPaint(){
  const d=$('#tDigits');if(d)d.textContent=timerDigits();
  const b=$('#tBar');if(b)b.style.width=(100*(1-T.left/(T.dur*60)))+'%';
}
function timerTick(){
  T.left=Math.max(0,Math.round((T.end-Date.now())/1000));timerPaint();
  if(T.left<=0)timerDone(true);
}
function timerStart(){
  if(T.run)return;T.run=true;T.end=Date.now()+T.left*1000;T.id=setInterval(timerTick,250);ctx();
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>{wake=w}).catch(()=>{});}catch(e){}
  render();
}
function timerPause(){clearInterval(T.id);T.run=false;render();}
function timerReset(){clearInterval(T.id);T.run=false;T.left=T.dur*60;render();}
function timerDone(complete){
  clearInterval(T.id);T.run=false;
  const doneSec=T.dur*60-T.left;const mins=complete?T.dur:Math.round(doneSec/60);
  try{if(wake)wake.release();}catch(e){}wake=null;
  if(complete){tone(880,0.25,'sine',0.35);tone(1175,0.4,'sine',0.35,(AC?AC.currentTime:0)+0.28);}
  T.left=T.dur*60;
  if(mins>=1)logSession(mins,dstr(new Date()),'timer');else{toast('Under a minute, so nothing was logged.');render();}
}
function logSession(min,d,src){
  S.sessions.push({id:uid(),d,min,src});save();
  const prog=S.goals[0]?goalIn(S.goals[0],pStart(S.goals[0].period,new Date())).pct:null;
  toast('Logged '+fm(min)+(prog!==null?'. Goal '+prog+'% done.':'.'));render();
}

/* ---------- recorder (Store extra) ---------- */
const REC={run:false,start:0,stream:null,mr:null,chunks:[],tm:0,an:null,ac:null,err:'',takes:null,db:null,loading:false,urls:{},mime:'',buf:null};
const REC_MAX=30*60;
const recSupported=()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
function recDB(){return new Promise((res,rej)=>{
  if(REC.db)return res(REC.db);
  let q;try{q=indexedDB.open('fretwise-rec',1);}catch(e){return rej(e);}
  q.onupgradeneeded=()=>q.result.createObjectStore('takes',{keyPath:'id'});
  q.onsuccess=()=>{REC.db=q.result;res(REC.db);};q.onerror=()=>rej(q.error);});}
function recTx(mode,fn){return recDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('takes',mode),st=tx.objectStore('takes'),r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);}));}
const recAll=()=>recTx('readonly',s=>s.getAll());
const recPut=t=>recTx('readwrite',s=>s.put(t));
const recDel=id=>recTx('readwrite',s=>s.delete(id));
function recLoad(){
  if(REC.loading||REC.takes)return;REC.loading=true;
  recAll().then(a=>{REC.takes=(a||[]).sort((x,y)=>y.created-x.created);}).catch(()=>{REC.takes=[];REC.err='Saving is not available in this browser, so recordings cannot be kept.';}).then(()=>{REC.loading=false;render();});
}
const recUrl=t=>REC.urls[t.id]||(REC.urls[t.id]=URL.createObjectURL(t.blob));
const recClock=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60);};
function recPaint(){
  const el=$('#recTime');if(el)el.textContent=recClock((Date.now()-REC.start)/1000);
  const l=$('#recLvl');
  if(l){let v=0;if(REC.an){if(!REC.buf)REC.buf=new Uint8Array(REC.an.fftSize);REC.an.getByteTimeDomainData(REC.buf);let m=0;for(let i=0;i<REC.buf.length;i++){const d=Math.abs(REC.buf[i]-128);if(d>m)m=d;}v=Math.min(100,m/128*140);}l.style.width=v+'%';}
}
async function recStart(){
  if(REC.run)return;REC.err='';
  if(!recSupported()){REC.err='This browser cannot record audio. Try a recent version of Chrome, Edge, Firefox or Safari.';render();return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
    const mime=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
    const mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
    REC.chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data);};mr.onstop=recFinish;
    REC.an=null;REC.ac=null;
    try{const A=window.AudioContext||window.webkitAudioContext;REC.ac=new A();const src=REC.ac.createMediaStreamSource(stream);REC.an=REC.ac.createAnalyser();REC.an.fftSize=512;src.connect(REC.an);}catch(e){REC.an=null;}
    REC.stream=stream;REC.mr=mr;REC.mime=mr.mimeType||mime||'audio/webm';REC.start=Date.now();REC.run=true;
    mr.start(1000);
    REC.tm=setInterval(()=>{recPaint();if((Date.now()-REC.start)/1000>=REC_MAX){toast('Reached the 30 minute limit. Saving your take.');recStop();}},120);
    render();
  }catch(e){
    const n=e&&e.name;
    REC.err=(n==='NotAllowedError'||n==='SecurityError')?'Microphone access was blocked. Allow the microphone for this page in your browser, then try again. If you are viewing this inside another page, open it in its own tab.':(n==='NotFoundError'?'No microphone was found. Plug one in and try again.':'Could not start recording.');
    render();
  }
}
function recStop(){if(!REC.run||!REC.mr)return;try{if(REC.mr.state!=='inactive')REC.mr.stop();}catch(e){recFinish();}}
function recFinish(){
  clearInterval(REC.tm);const dur=(Date.now()-REC.start)/1000;REC.run=false;
  try{REC.stream.getTracks().forEach(t=>t.stop());}catch(e){}
  try{if(REC.ac)REC.ac.close();}catch(e){}REC.an=null;REC.ac=null;
  const blob=new Blob(REC.chunks,{type:REC.mime});REC.chunks=[];
  if(dur<1||!blob.size){toast('That was under a second, so it was not saved.');render();return;}
  const kind=ui.recKind||'practice',n=(REC.takes||[]).filter(t=>t.kind===kind).length+1;
  const title=(ui.recTitle||'').trim()||(kind==='song'?'Song idea '+n:'Practice, '+new Date().toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}));
  const take={id:uid(),title:title.slice(0,60),kind,notes:'',created:Date.now(),dur,mime:REC.mime,size:blob.size,blob};

}
async function recDownload(x){

function dueNow(){

  return S.plans.filter(p=>p.remind&&p.days.includes(wd)&&p.time<=hm&&!S.fired[p.id+td]&&planProgress(p).done<p.times
    &&!sessionsIn(td,td).some(s=>s.min>=p.dur));
}
function checkReminders(){
  const now=new Date(),hm=pad(now.getHours())+':'+pad(now.getMinutes()),wd=(now.getDay()+6)%7,td=dstr(now);
  S.plans.forEach(p=>{
    if(p.remind&&p.days.includes(wd)&&p.time===hm&&!S.fired[p.id+td]){

function tabList(){

  return [['learn','Learn'],['practice','Practice']].concat(toolsOn()?[['tools','Toolbox']]:[]).concat([['store','Store']]);
}
function drawTabs(){

}
function weekStrip(){
  const ws=weekStart(new Date()),td=dstr(new Date());
  let h='<div class="fb" role="img" aria-label="Minutes practiced each day this week">';
  [8,24,40,56,72,88].forEach(p=>h+=`<span class="str" style="top:${p}%"></span>`);
  for(let i=0;i<7;i++){
    const d=dstr(addDays(ws,i)),m=sessionsIn(d,d).reduce((a,s)=>a+s.min,0),sz=m?Math.min(46,22+m/3):22;
    h+=`<div class="cell"><span class="dot ${m?'':'empty'} ${d===td?'today':''}" style="width:${sz}px;height:${sz}px">${m?m:''}</span><span class="dl">${DAYS[i]}</span></div>`;
  }
  return h+'</div>';
}

        ${gs.targets.map(t=>`<div class="row between"><span>${t.count} × ${fm(t.dur)}</span><span class="mono">${Math.min(t.done,t.count)} / ${t.count}</span></div>`).join('')}

  let h=`<header class="stack"><div class="eyebrow">Curriculum</div><h1>Learn</h1>
    <p class="muted">Tailored for your ${TYPES[prof().type].name.toLowerCase()} guitar. ${done} of ${FREE?FREE_LESSONS.length:LESSONS.length} ${FREE?'free ':''}lessons done. ${FREE?'':' After every three lessons a progression challenge tests all three together.'}</p>${S.skipped&&Object.keys(S.skipped).length?`<p class="notice">You started at ${skillOf(prof().level).name.toLowerCase()} level, so earlier lessons are marked skipped and still open.${FREE?'':' Take the challenges to test yourself on them.'}</p>`:''}${FREE?(()=>{const nl=nextLesson();return (nl?`<div class="notice"><span>Up next: <b>${esc(nl.title)}</b></span><button class="btn small" data-act="openLesson" data-v="${nl.id}">Continue</button></div>`:'<div class="notice"><span>You have finished the free lessons. The subscription unlocks the rest of the course.</span></div>')+'<div><button class="btn ghost small" data-act="tab" data-v="profile">Profile and guitar</button></div>';})():''}</header>`;
  units.forEach(u=>{
    h+=`<section class="unit"><h2>${u}</h2>`;
    LESSONS.filter(l=>l.unit===u).forEach(l=>{
      if(!lessonOpen(l.id)){h+=`<button class="lesson locked" data-act="subLock" aria-disabled="true"><span class="n">–</span><div><b>${esc(l.title)}</b><div class="muted">${esc(l.blurb)} · Subscription</div></div></button>`;return;}
      h+=`<button class="lesson ${S.lessons[l.id]?'done':''}" data-act="openLesson" data-v="${l.id}"><span class="n">${S.lessons[l.id]?'✓':lnum(l.id)}</span><div><b>${esc(l.title)}</b><div class="muted">${esc(l.blurb)} · ${l.min} min${S.skipped&&S.skipped[l.id]?' · skipped for your level':''}</div></div></button>`;
      const c=CHALS.find(c=>c.lessons[c.lessons.length-1]===l.id);
      if(c&&!FREE){const open=chalOpen(c),r=S.chals[c.id];
        h+=`<button class="lesson chal ${open?'':'locked'}" ${open?`data-act="openChal" data-v="${c.id}"`:'aria-disabled="true" data-act="locked"'}><span class="n">★</span><div><b>${c.title}${r&&r.done?' · passed':''}</b><div class="muted">${open?esc(c.blurb):'Finish lessons '+c.lessons.map(lnum).join(', ')+' to unlock'}</div></div></button>`;}
    });
    h+='</section>';
  });
  return h;
}
function chalQuestions(c){

  <section class="card"><h2>Part 2: quiz on all three lessons</h2>
    ${qs.map((x,i)=>{const a=ui.cq[x.key];return `<div class="stack"><b>${i+1}. ${esc(H(x.q.q))}</b>${x.q.o.map((o,oi)=>{
      let cls=a===oi?'sel':'';if(res&&a===oi)cls=oi===x.q.a?'right':'wrong';

    ${r&&r.done?`<span class="pill good">Passed with ${r.score} of ${qs.length}</span>`:''}</section>`;

function viewGoals(){
  let h=`<header class="stack"><div class="eyebrow">Targets and results</div><h1>Goals</h1></header>`;
  S.goals.forEach(g=>{
    const hist=goalHistory(g),cur=hist[hist.length-1],past=hist.filter(x=>!x.current);
    const avg=past.length?Math.round(past.reduce((a,x)=>a+x.pct,0)/past.length):null;
    const met=past.filter(x=>x.pct>=100).length;
    const agg={};past.forEach(x=>x.targets.forEach(t=>{const a=agg[t.dur]||(agg[t.dur]={done:0,need:0});a.done+=Math.min(t.done,t.count);a.need+=t.count;}));
    const worst=Object.entries(agg).map(([d,a])=>({d:+d,r:a.need?a.done/a.need:1})).sort((a,b)=>a.r-b.r)[0];
    const best=past.slice().sort((a,b)=>b.pct-a.pct)[0];
    const shown=hist.slice(-8);
    h+=`<section class="card"><div class="row between"><div><h2>${esc(g.name)}</h2><span class="muted">Per ${g.period}: ${g.targets.map(t=>t.count+' × '+fm(t.dur)).join(', ')}</span></div><button class="btn small danger" data-act="delGoal" data-v="${g.id}">Delete</button></div>
      <div class="grid2" style="gap:12px">
        <div class="stat"><b>${cur.pct}%</b><span class="muted">this ${g.period}</span></div>
        ${past.length?`<div class="stat"><b>${avg}%</b><span class="muted">average completion, past ${past.length} ${g.period}${past.length===1?'':'s'}</span></div>
        <div class="stat"><b>${met} of ${past.length}</b><span class="muted">${g.period}s fully met</span></div>`:''}
        <div class="stat"><b>${fm(cur.minutes)}</b><span class="muted">of ${fm(cur.targetMin)} planned this ${g.period}</span></div></div>
      <h3>This ${g.period}</h3>
      ${cur.targets.map(t=>`<div class="stack" style="gap:4px"><div class="row between"><span>${t.count} × ${fm(t.dur)} sessions</span><span class="mono">${Math.min(t.done,t.count)} / ${t.count}</span></div><div class="bar ${t.done>=t.count?'good':''}"><i style="width:${Math.min(100,100*t.done/t.count)}%"></i></div></div>`).join('')}
      <p class="muted" style="font-size:.85rem">A session counts toward the longest target it meets that still has room.</p>
      <h3>Completion by ${g.period}</h3>
      <div class="hist" role="img" aria-label="Goal completion for each ${g.period}">${shown.map(x=>`<div class="col"><span class="v">${x.pct}%</span><div class="b ${x.pct>=100?'full':''}" style="height:${Math.max(2,x.pct*0.8)}px"></div><span class="l">${g.period==='week'?fmtDay(dstr(x.start)):x.start.toLocaleDateString(undefined,{month:'short'})}</span></div>`).join('')}</div>
      <h3>Performance breakdown</h3>
      <ul style="margin:0;padding-left:18px;display:grid;gap:4px">
        ${best?`<li>Best ${g.period}: ${best.pct}% (${g.period==='week'?'week of '+fmtDay(dstr(best.start)):best.start.toLocaleDateString(undefined,{month:'long'})}).</li>`:''}
        ${!past.length?`<li>Trends appear after your first full ${g.period}.</li>`:worst&&worst.r<1?`<li>The target you miss most often is the ${fm(worst.d)} session, hit ${Math.round(worst.r*100)}% of the time.</li>`:'<li>You have hit every target in past periods.</li>'}
        <li>${cur.n} session${cur.n===1?'':'s'} this ${g.period}, averaging ${cur.n?fm(Math.round(cur.minutes/cur.n)):'0 min'}.</li></ul>
      <div class="scroll"><table><thead><tr><th>${g.period==='week'?'Week of':'Month'}</th><th>Done</th><th>Sessions</th><th>Minutes</th></tr></thead><tbody>
        ${hist.slice().reverse().slice(0,10).map(x=>`<tr><td>${g.period==='week'?fmtDay(dstr(x.start)):x.start.toLocaleDateString(undefined,{month:'short',year:'numeric'})}${x.current?' <span class="pill">now</span>':''}</td><td class="mono">${x.pct}%</td><td class="mono">${x.n}</td><td class="mono">${x.minutes}</td></tr>`).join('')}</tbody></table></div></section>`;
  });
  h+=`<section class="card"><div class="row between"><h2>${S.goals.length?'Add another goal':'Set a goal'}</h2><button class="btn small" data-act="newGoal">${ui.showGoalForm?'Close':'New goal'}</button></div>${ui.showGoalForm?goalForm(ui.gDraft):'<p class="muted">Mix session lengths, for example 3 sessions of 1 hour and 7 sessions of 10 minutes each week.</p>'}</section>`;
  return h;
}
function goalForm(d){
  const durs=[10,20,30,45,60,90,120];
  return `<label class="f">Goal name<input type="text" id="gName" value="${esc(d.name)}" data-in="gname" maxlength="40"></label>

}

const _cnt={};
function packCount(id){if(_cnt[id]==null){let n=0;for(let r=0;r<12;r++)CE.packChords(id,r).forEach(c=>n+=c.v.length);_cnt[id]=n;}return _cnt[id];}
const packName=id=>id==='lib'?'Full chord library':id==='starter'?'Starter chords':CE.PACKS[id].name.replace(/^./,c=>c.toUpperCase());
const BUNDLE_PRICE=19.99;
const priceNum=p=>+p.replace('$','');
function ownedPacks(){return (own('lib')?['lib']:[]).concat(PACK_IDS.filter(own));}
function viewChords(){
  const avail=(FREE?[]:['starter']).concat(ownedPacks());
  if(!avail.length)return '<section class="card"><p class="muted">No chord library yet.</p><button class="btn small" data-act="goStore" data-v="Chord library">Open the Store</button></section>';
  if(!avail.includes(ui.cpack))ui.cpack=avail[0];
  const id=ui.cpack,unowned=['lib'].concat(PACK_IDS).filter(x=>!own(x)).length;
  let h=`<div class="row">${avail.map(a=>`<button class="chip" data-act="cpack" data-v="${a}" aria-pressed="${id===a}">${esc(packName(a))}</button>`).join('')}</div>`;
  if(id==='starter'){
    h+=`<section class="card"><h2>Starter chords</h2><p class="muted">The 12 open chords every player meets first. The full library in the Store adds every chord in every key.</p><div class="diagrams">${LIMITED.map(chordFig).join('')}</div></section>`;
  }else{
    h+=`<div class="row"><span class="muted">Key</span>${['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'].map((n,r)=>`<button class="chip" data-act="croot" data-v="${r}" aria-pressed="${ui.croot===r}">${n}</button>`).join('')}</div>
    <p class="muted">${esc(PACK_INFO[id].tip)} The coloured dots are the root notes. Strings run low to high from left to right.</p>`;
    const list=CE.packChords(id,ui.croot);
    if(id==='lib')h+=`<section class="card"><div class="diagrams">${list.map(c=>c.v[0]?diagram(c.v[0],c.label,c.v[0].sub):'').join('')}</div></section>`;
    else h+=list.filter(c=>c.v.length).map(c=>`<section class="card"><h3>${esc(c.label)}</h3><div class="diagrams">${c.v.map(v=>diagram(v,c.label,v.sub)).join('')}</div></section>`).join('');
  }
  if(unowned)h+=`<section class="card row between"><div><b>More chords in the Store</b><div class="muted">${unowned} more ${unowned===1?'item':'items'}: other forms, neck locations and rarer chords.</div></div><button class="btn small" data-act="goStore" data-v="Chord library">See the Store</button></section>`;

function viewTools(){
  const chips0=[];
  if(!FREE||own('metro'))chips0.push(['metro','Metronome']);
  if(!FREE)chips0.push(['tune','Tuning tones']);
  if(!FREE||own('rec'))chips0.push(['rec','Recorder']);
  if(!FREE||hasChords())chips0.push(['chords','Chord library']);
  if(!chips0.some(c=>c[0]===ui.tool))ui.tool=chips0.length?chips0[0][0]:'chords';
  let h=`<header class="stack"><div class="eyebrow">Practice helpers</div><h1>Toolbox</h1></header><div class="row">${chips0.map(s=>`<button class="chip" data-act="tool" data-v="${s[0]}" aria-pressed="${ui.tool===s[0]}">${s[1]}${(s[0]==='metro'&&!own('metro'))||(s[0]==='rec'&&!own('rec'))?' (Store)':''}</button>`).join('')}</div>`;
  if(ui.tool==='metro'){
    if(!own('metro'))return h+`<section class="card"><h2>Metronome</h2><p class="muted">The metronome is an optional extra. It keeps steady time at 40 to 220 BPM, with 2 to 6 beats per bar and tap tempo.</p><div><button class="btn" data-act="goStore" data-v="Tools">Get it in the Store</button></div></section>`;
    h+=`<section class="card"><div class="timer"><div class="big"><span id="bpmNum">${Met.bpm}</span> <span class="muted" style="font-size:1rem">BPM</span></div>
      <input type="range" id="bpm" min="40" max="220" value="${Met.bpm}" data-in="bpm" aria-label="Tempo in beats per minute" style="max-width:420px">
      <div class="beats" aria-hidden="true">${Array.from({length:Met.beats},()=>'<span class="beat"></span>').join('')}</div>
      <div class="row" style="justify-content:center"><span class="muted">Beats per bar</span>${chips([2,3,4,6],Met.beats,'mbeats')}</div>
      <div class="row" style="justify-content:center"><button class="btn" id="metGo" data-act="mtoggle">${Met.run?'Stop':'Start'}</button><button class="btn ghost" data-act="mtap">Tap tempo</button></div></div></section>`;
  }else if(ui.tool==='tune'){
    const st=[['E','6th',82.41],['A','5th',110],['D','4th',146.83],['G','3rd',196],['B','2nd',246.94],['e','1st',329.63]];
    h+=`<section class="card"><h2>Tuning tones</h2><p class="muted">Tap a string, listen, and turn the tuning peg until your guitar matches the tone. Standard tuning, thickest string first.</p>
      <div class="row">${st.map(s=>`<button class="btn ghost" data-act="tone" data-v="${s[2]}" style="min-width:92px"><b style="font-size:1.3rem;font-family:var(--f-display)">${s[0]}</b><br><span class="muted" style="font-size:.78rem">${s[1]} · ${s[2]} Hz</span></button>`).join('')}</div></section>`;
  }else if(ui.tool==='rec')h+=viewRecorder();
  else h+=viewChords();
  return h;
}

const STORE_CATS=['Tools','Chord library','Chord packs'];
const SEP_TOTAL=['lib'].concat(PACK_IDS).reduce((a,k)=>a+priceNum(PACK_INFO[k].price),0);

 .concat(PACK_IDS.map(id=>({id,cat:'Chord packs',name:packName(id),price:PACK_INFO[id].price,desc:PACK_INFO[id].desc})));
function previewOf(id){
  if(id==='metro'||id==='bundle'||id==='rec')return '';
  const l=CE.packChords(id,0);
  const figs=id==='lib'?l.slice(0,3).map(c=>diagram(c.v[0],c.label,c.v[0].sub)):l.find(c=>c.v.length).v.slice(0,3).map(v=>diagram(v,l.find(c=>c.v.includes(v)).label,v.sub));
  return `<details><summary>Preview</summary><div class="diagrams" style="margin-top:8px">${figs.join('')}</div></details>`;
}

  S.owned=S.owned||{};
  const items=STORE.filter(x=>ui.store==='All'||x.cat===ui.store),mine=STORE.filter(x=>S.owned[x.id]);

  <div class="notice">Prototype store. Items, names and prices are examples, and purchases are simulated: no payment is taken.</div>

  <div class="grid2">${items.map(x=>`<section class="card"><div class="row between"><span class="row" style="gap:6px"><span class="pill">${esc(x.cat)}</span>${x.id==='bundle'?'<span class="pill good">Best value</span>':''}</span><span class="mono">${S.owned[x.id]?'':esc(x.price)}</span></div><h3>${esc(x.name)}</h3><p class="muted">${esc(x.desc)}${PACK_INFO[x.id]?' '+packCount(x.id)+' chord shapes.':''}</p>${!S.owned.bundle&&!S.owned[x.id]&&x.id!=='bundle'&&x.id!=='metro'&&x.id!=='rec'?`<p class="muted" style="font-size:.88rem"><b>Better value:</b> the Complete chord collection has every chord item for $${BUNDLE_PRICE.toFixed(2)} (save ${SAVE_PCT}%).</p>`:''}${previewOf(x.id)}
    ${S.owned[x.id]?'<span class="pill good">In your library</span>':ui.buy===x.id?`<div class="notice"><span>Test purchase of ${esc(x.name)}. No payment is taken.</span><span class="row"><button class="btn small" data-act="buyYes" data-v="${x.id}">Confirm</button><button class="btn small ghost" data-act="buyNo">Cancel</button></span></div>`:`<div><button class="btn small" data-act="buy" data-v="${x.id}">Buy</button></div>`}</section>`).join('')}</div>
  <section class="card"><h2>Your library</h2>${mine.length?mine.map(x=>`<div class="row between"><b>${esc(x.name)}</b><span class="muted">${esc(x.cat)}</span></div>`).join('')+(toolsOn()?'<div><button class="btn small ghost" data-act="tab" data-v="tools">Open Toolbox</button></div>':''):'<p class="muted">Items you buy appear here.</p>'}</section>`;
}
function render(){
  buildLessons();
  const ob=!S.profile||ui.ob;
  if(ob&&!ui.ob)ui.ob={step:0,name:'',age:null,type:null,hand:'right',level:null,goal:'songs',plan:!FREE&&!S.profile};
  document.body.classList.toggle('kid',!!S.profile&&S.profile.age==='kid');
  $('.app').classList.toggle('solo',!!ob);
  $('#tabs').hidden=!!ob;
  if(!ob)drawTabs();
  const v=$('#view');
  v.innerHTML=ob?viewOnboard():ui.tab==='today'?viewToday():ui.tab==='learn'?viewLearn():ui.tab==='practice'?viewPractice():ui.tab==='goals'?viewGoals():ui.tab==='profile'?viewProfile():ui.tab==='store'?viewStore():viewTools();
  if(T.run)timerPaint();
  if(REC.run)recPaint();
}

/* ---------- events ---------- */
function newPlanDraft(){return {dur:20,times:3,per:'week',days:[0,2,4],time:'18:30',remind:true};}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,v=t.dataset.v;
  switch(a){
    case 'tab':ui.tab=v;ui.lesson=null;ui.chal=null;render();window.scrollTo(0,0);break;
    case 'locked':toast('Finish the three lessons above to unlock this challenge.');break;
    case 'subLock':toast('This lesson is part of the full version, which is a subscription.');break;
    case 'goStore':ui.tab='store';ui.store=v||'All';ui.buy=null;render();window.scrollTo(0,0);break;
    case 'cpack':ui.cpack=v;render();break;
    case 'rkind':ui.recKind=v;render();break;
    case 'rstart':recStart();break;
    case 'rstop':recStop();break;
    case 'rfilter':ui.recFilter=v;render();break;
    case 'ropen':ui.recOpen=ui.recOpen===v?null:v;ui.recDel=null;render();break;
    case 'rmove':{const x=(REC.takes||[]).find(q=>q.id===v);if(x){x.kind=x.kind==='song'?'practice':'song';recPut(x).catch(()=>{});toast('Moved to '+(x.kind==='song'?'songs':'practice')+'.');render();}break;}
    case 'rdl':{const x=(REC.takes||[]).find(q=>q.id===v);if(x)recDownload(x);break;}
    case 'rdel':ui.recDel=v;render();break;
    case 'rdelNo':ui.recDel=null;render();break;
    case 'rdelYes':{recDel(v).catch(()=>{});REC.takes=(REC.takes||[]).filter(q=>q.id!==v);if(REC.urls[v]){URL.revokeObjectURL(REC.urls[v]);delete REC.urls[v];}ui.recDel=null;if(ui.recOpen===v)ui.recOpen=null;toast('Recording deleted.');render();break;}
    case 'croot':ui.croot=+v;render();break;
    case 'openLesson':if(!lessonOpen(v)){toast('This lesson is part of the full version, which is a subscription.');break;}ui.tab='learn';ui.lesson=v;ui.chal=null;render();window.scrollTo(0,0);break;
    case 'openChal':ui.chal=v;ui.cres=null;render();window.scrollTo(0,0);break;
    case 'back':ui.lesson=null;ui.chal=null;render();break;
    case 'ans':{const l=t.dataset.l;(ui.lq[l]=ui.lq[l]||[])[+t.dataset.q]=+t.dataset.o;render();break;}
    case 'complete':S.lessons[v]=true;if(S.skipped)delete S.skipped[v];save();toast('Lesson complete. +50 fret points.');render();break;
    case 'cans':ui.cq[t.dataset.k]=+t.dataset.o;ui.cres=null;render();break;
    case 'submitChal':{
      const c=CHALS.find(c=>c.id===v),qs=chalQuestions(c);let score=0;const review=new Set();
      qs.forEach(x=>{if(ui.cq[x.key]===x.q.a)score++;else review.add(x.lesson);});
      const need=Math.ceil(qs.length*0.8),pass=score>=need;
      ui.cres={id:v,score,need,pass,review:[...review]};
      if(pass&&!(S.chals[v]&&S.chals[v].done)){S.chals[v]={done:true,score};save();}
      render();break;}
    case 'retryChal':ui.cq={};ui.cres=null;render();break;
    case 'clearDemo':S.sessions=S.sessions.filter(s=>!s.demo);S.demo=false;save();render();toast('Sample data cleared.');break;
    case 'quick':T.dur=+v;T.left=T.dur*60;ui.tab='practice';render();window.scrollTo(0,0);break;
    case 'startPlan':{const p=S.plans.find(p=>p.id===v);if(p){T.dur=p.dur;T.left=p.dur*60;ui.tab='practice';render();window.scrollTo(0,0);}break;}
    case 'tdur':if(!T.run){T.dur=+v;T.left=T.dur*60;render();}break;
    case 'tstart':timerStart();break;
    case 'tpause':timerPause();break;
    case 'treset':timerReset();break;
    case 'tfinish':timerDone(false);break;
    case 'logManual':{const m=Math.round(+ui.logMin);if(m>=1&&m<=600){logSession(m,ui.logDate||dstr(new Date()),'manual');}else toast('Enter between 1 and 600 minutes.');break;}
    case 'delSession':S.sessions=S.sessions.filter(s=>s.id!==v);save();render();break;
    case 'newPlan':ui.showPlanForm=!ui.showPlanForm;ui.pDraft=newPlanDraft();render();break;
    case 'pdur':ui.pDraft.dur=+v;render();break;
    case 'pper':ui.pDraft.per=v;render();break;
    case 'pday':{const d=ui.pDraft.days,i=+v;ui.pDraft.days=d.includes(i)?d.filter(x=>x!==i):d.concat(i).sort();render();break;}
    case 'savePlan':{const d=ui.pDraft;S.plans.push({id:uid(),dur:d.dur,times:Math.max(1,d.times|0),per:d.per,days:d.days.slice(),time:d.time||'18:00',remind:d.remind});save();ui.showPlanForm=false;toast('Plan saved.');render();break;}
    case 'delPlan':S.plans=S.plans.filter(p=>p.id!==v);save();render();break;
    case 'newGoal':ui.showGoalForm=!ui.showGoalForm;ui.gDraft={name:'My goal',period:'week',targets:[{dur:60,count:3},{dur:10,count:7}]};render();break;
    case 'gper':ui.gDraft.period=v;render();break;
    case 'gadd':ui.gDraft.targets.push({dur:30,count:2});render();break;
    case 'gdel':ui.gDraft.targets.splice(+v,1);render();break;
    case 'saveGoal':{const d=ui.gDraft;S.goals.push({id:uid(),name:(d.name||'My goal').trim()||'My goal',period:d.period,start:dstr(pStart(d.period,new Date())),targets:d.targets.map(x=>({dur:x.dur,count:Math.max(1,x.count|0)}))});save();ui.showGoalForm=false;toast('Goal saved.');render();break;}
    case 'delGoal':S.goals=S.goals.filter(g=>g.id!==v);save();render();break;
    case 'tool':ui.tool=v;render();break;
    case 'mbeats':Met.beats=+v;Met.cur=0;render();break;
    case 'mtoggle':metToggle();break;
    case 'mtap':{const n=Date.now();Met.taps=Met.taps.filter(x=>n-x<2500).concat(n).slice(-5);

    case 'tone':tone(+v,2.2,'triangle',0.35);break;

    case 'obNext':ui.ob.step++;render();window.scrollTo(0,0);break;
    case 'obBack':ui.ob.step--;render();break;
    case 'obAge':ui.ob.age=v;render();break;
    case 'obType':ui.ob.type=v;render();break;
    case 'obHand':ui.ob.hand=v;render();break;
    case 'obLevel':ui.ob.level=v;render();break;
    case 'obGoal':ui.ob.goal=v;render();break;
    case 'storeCat':ui.store=v;ui.buy=null;render();break;
    case 'buy':ui.buy=v;render();break;
    case 'buyNo':ui.buy=null;render();break;

    case 'setLevel':S.profile.level=v;applyPlacement(v);save();render();toast('Level set to '+skillOf(v).name.toLowerCase()+'.');break;
    case 'setHand':S.profile.hand=v;save();render();break;

    case 'gname':ui.gDraft.name=t.value;break;
    case 'gcount':ui.gDraft.targets[+t.dataset.i].count=+t.value;break;
    case 'ptimes':ui.pDraft.times=+t.value;break;
    case 'ptime':ui.pDraft.time=t.value;break;
    case 'pdurNum':ui.pDraft.dur=Math.max(60,Math.min(300,+t.value||60));break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.in;if(!k)return;
  if(k==='rtitle2'||k==='rnotes'){const x=(REC.takes||[]).find(q=>q.id===t.dataset.id);if(x){if(!x.title.trim())x.title='Untitled take';recPut(x).catch(()=>{});}}
  else if(k==='gdur'){ui.gDraft.targets[+t.dataset.i].dur=+t.value;}
  else if(k==='obplan'){ui.ob.plan=t.checked;}
  else if(k==='drill'){ui.ct[t.dataset.id]=t.checked;if(ui.cres)ui.cres=null;render();}
  else if(k==='premind'){
    ui.pDraft.remind=t.checked;
    if(t.checked){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(()=>render()).catch(()=>{});}catch(err){}}
    render();
  }
});

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const t=e.target.closest&&e.target.closest('g[data-act]');if(t){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
render();
})();
</script>
